<section class="container my-4">
    <h2>Enrollment Form</h2>
    <form id="enrollmentForm" action="submit_enrollment.php" method="POST">
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" class="form-control" min="16" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="allergies">Allergies or Special Needs:</label>
            <textarea id="allergies" name="allergies" class="form-control" rows="4" placeholder="Please specify any allergies or special needs..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit Enrollment</button>
    </form>
</section>
